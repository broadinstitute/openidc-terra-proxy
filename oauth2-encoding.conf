# Pass claim values to the backend verbatim, as liboauth2 1.x did. liboauth2 2.x
# defaults to encoding=latin1, which rewrites any character outside ISO-8859-1 as "?"
# and re-encodes the rest, so a claim such as a non-ASCII email would no longer match
# the identity the backend has stored.
#
# Kept out of oauth2.conf on purpose: deployments (terra-helmfile) mount their own
# oauth2.conf and site.conf over ours, and this must survive that. Server-level, so it
# applies to every VirtualHost. This file sorts before oauth2.conf and site.conf, so a
# deployment that sets its own OAuth2TargetPass encoding there takes precedence.
OAuth2TargetPass encoding=none
