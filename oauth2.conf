# See https://raw.githubusercontent.com/zmartzone/mod_oauth2/master/oauth2.conf for more examples
# Call the introspection endpoint (introspect.conf) directly over loopback HTTPS. It only
# accepts requests from 127.0.0.1/::1, so it must not go through the port-80 redirect to
# ${SERVER_NAME}. ssl_verify=false because the local certificate is for SERVER_NAME.
OAuth2TokenVerify introspect https://127.0.0.1:${SSL_HTTPD_PORT}${INTROSPECT_PATH} introspect.ssl_verify=false&verify.exp=required&verify.iat=skip
