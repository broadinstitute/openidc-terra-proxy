# Introspection endpoint (introspect/), run by mod_cgid per request. liboauth2
# caches results, so it only runs for tokens it hasn't seen recently.
#
# Kept out of site.conf on purpose: deployments (terra-helmfile) mount their own
# site.conf and oauth2.conf over ours, and this must survive that. Server-level, so
# it applies to every VirtualHost. Sections inside a VirtualHost are applied after
# these, so a mounted site.conf's own <Location ${INTROSPECT_PATH}> takes precedence.
ScriptAlias ${INTROSPECT_PATH} /app/introspect/introspect

<Location ${INTROSPECT_PATH}>
    # Red Hat's Go uses the system OpenSSL in FIPS mode, matching SSLFIPS On.
    SetEnv GOLANG_FIPS 1
    # No "RewriteEngine off" here: at server level it would also disable a
    # VirtualHost's own rewrite rules for this path, such as an HTTP-to-HTTPS redirect.
    # Only mod_oauth2 in this container calls the endpoint.
    Require ip 127.0.0.1 ::1
    AuthType None
</Location>
