# Stands in for a site.conf mounted over the image's own, as deployments do. It
# defines only what such a config must: TLS and one authenticated location. It
# deliberately says nothing about the introspection endpoint, which the image provides.
ServerName ${SERVER_NAME}

<VirtualHost _default_:443>
    ErrorLog /dev/stdout
    CustomLog /dev/stdout combined

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/server.crt
    SSLCertificateKeyFile /etc/ssl/private/server.key

    <Location /api>
        AuthType oauth2
        Require valid-user
        ProxyPass http://echo:8080/api
    </Location>
</VirtualHost>
